# robot params
robot:
  params:
    netty:
      tcp:
        port: 8988
      udp:
        port: 8988
    connection:
      message:
        everyHandleTimeThresholdMs: 1000
        averageHandleTimeThresholdMs: 1000
      unreliableTimeoutMs: 3000
      disconnectedTimeoutMs: 15000
      udp:
        resendInterval: 5000
        checkInterval: 100
        maxResendTimes: 10
    cancel:
      timeoutMs: 60000
    offline:
      command:
        timeoutMs: 60000
      charge:
        timeoutMs: 3600000
    containerUpdate:
      timeoutMs: 5000
    charge:
      rotate:
        angularAcceleration: 100
        angularDeceleration: 80
        angleVelocity: 60
      stop:
        timeoutMs: 60000
    lightMusic:
      isOpen: false
      pointOpenLightMusicMonitor: false
      stop:
        timeoutMs: 3000
    grpc:
      response:
        timeoutMs: 20000
    # 货架角度的精度，单位°
    rack:
      orientation:
        accuracy: 3.0
    ### hairou server
    kubo:
      isEnabled: ${KUBO_SERVER_SWITCH:false}
    haiserver:
      ### if enable hairou server
      isEnabled: ${HAI_SERVER_SWITCH:false}
      ### hairou redis config
      redis:
        host: ${HAI_REDIS_HOST:localhost}
        password: ${HAI_REDIS_PASSWORD:}
        timeout: ${HAI_REDIS_TIMEOUT:2000}
        database: ${HAI_REDIS_DATABASE:0}
      jedis:
        max:
          wait: 2000
          total: 10
          idle: 4
        min:
          idle: 2
        timeBetweenEvictionRuns: 120000
        minEvictableIdleTime: 60000
      ### hairou kafka config
      kafka:
        server: static://${HAI_KAFKA_HOST:localhost}:${HAI_KAFKA_PORT:9092}
        groupId: ${HAI_KAFKA_GROUP:group-1}
        security:
          protocol: ${HAI_KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
        sasl:
          mechanism: ${HAI_KAFKA_SASL_MECHANISM:PLAIN}
        username: ${HAI_KAFKA_USERNAME:}
        password: ${HAI_KAFKA_PASSWORD:}
        producer:
          topic: ${HAI_KAFKA_PRODUCER_TOPIC:ll}
        consumer:
          topic: ${HAI_KAFKA_CONSUMER_TOPIC:ss}
    #seer agv params
    seer:
      seer: ${SEER_SERVER_SWITCH:false}
      forkliftMoveHeight: -1.0
      rotateTypeEnabled: false

  # 无需更新端口到db的车型
  ignore-port-types:
    - AM15
    - KMP1500I
    - HaiRou-Slam
    - BasiclineA42-SLAM
    - HAIPICKA42
    - HAIPICKA42-g-E4

#vda5050 agv params
vda:
  agv:
    isEnabled: ${VDA_SERVER_SWITCH:false}
    params:
      host: tcp://${VDA_MQTT_HOST:mqtt-broker}:${VDA_MQTT_PORT:1883}

#robot manager params for Robot with Nav 2.0, like KMR iisy
robotmanager:
  params:
    enable: ${ROBOTMANAGER_SWITCH:false}
    collisionAvoidance:
      defaultMaxDistance: 2
    safetyConfig:
      enable: false
    cameraConfig:
      enable: false

# hik agv params
## obstacle avoidance

hik:
  agv:
    params:
      # target accuracy strategy
      accuracyLevel: 0
      distanceAccuracy: 8
      angleAccuracy: 2000
      rackAngleAccuracy: 2000
      avoid:
        distanceThreshold: 1000
        ### stop area
        frontSafeDistance4Stop: 150
        backSafeDistance4Stop: 50
        leftSafeDistance4Stop: 50
        rightSafeDistance4Stop: 50
        ### slow down area 1
        frontSafeDistance4Slow1: 1000
        backSafeDistance4Slow1: 200
        leftSafeDistance4Slow1: 200
        rightSafeDistance4Slow1: 200
        velocity4Slow1: 200
        deceleration4Slow1: 300
        ### slow down area 2
        frontSafeDistance4Slow2: 400
        backSafeDistance4Slow2: 100
        leftSafeDistance4Slow2: 100
        rightSafeDistance4Slow2: 100
        velocity4Slow2: 100
        deceleration4Slow2: 200
      lift:
        # 举货架精度, 举货架前, 货架与小车之间距离需满足的精度 (mm)
        upAccuracy: 30
        # 降货架精度, 下放货架的精度 (mm)
        downAccuracy: 20
        # 下降是否采用盲降
        downBlind: false
      rack:
        delay: 1000
  ## cancel stop space
  cancel:
    stop:
      space: 3000
  ctu:
    obstacleShieldArea: 0

kuka:
  vda:
    params:
      server:
        isEnabled: false
        host: tcp://127.0.0.1:1883
        clientId: kuka-1
        userName: admin
        password: admin
        topicPrefix: uagv/v1/kuka/
      accuracyLevel: 0
      distanceAccuracy: 8
      angleAccuracy: 1
      rackAngleAccuracy: 1
      avoid:
        # stop areafrontSafeDistance4Stop
        frontSafeDistance4Stop: 0.1
        backSafeDistance4Stop: 0.05
        leftSafeDistance4Stop: 0.05
        rightSafeDistance4Stop: 0.05
        # 障碍物检测范围
        nearExcludeXmin: 0
        farExcludeXmax: 4
        rightExcludeYmin: -2
        leftExcludeYmax: 2
        lowDetectZmin: -0.2
        highDetectZmax: 2
        # 空车状态下无效区的膨胀参数 单位m
        expandExcludeArea: 0
        expandExcludeAreaOnload: 0.1
        rotateSafeAreaOffset: 0.1
        relativeAngleAccuracy: 10
        onloadZmax: 1
        # 进出支架时安全区的参数（空车） 单位mm
        accessHolderZmax: 0
        accessHolderY: 0
        # 进出货架时安全区的参数（空车） 单位m
        accessContainerZmax: 0.05
        accessContainerX: 0.1
        accessContainerY: 0.02
        # 进出电梯时安全区的参数（空车） 单位m
        accessElevatorX: 0.25
        accessElevatorY: 0
      move:
        maxAngularVelocity: 1
        linearAcceleration: 1
        linearDeceleration: 1
        angularAcceleration: 40
        angularDeceleration: 40
      rack:
        hasBucketModel: true
        verifyRackCode: true
      lift:
        liftWithGoalNode: false

# kukai agv params
## obstacle avoidance
kukai:
  remote:
    openRemoteStartup: false
    wifi:
      port: 8143
  agv:
    params:
      avoid:
        distanceThreshold: 1000
        ### stop area
        frontSafeDistance4Stop: 250
        backSafeDistance4Stop: 0
        leftSafeDistance4Stop: 50
        rightSafeDistance4Stop: 50
        ### slow down area 1
        frontSafeDistance4Slow1: 1000
        backSafeDistance4Slow1: 200
        leftSafeDistance4Slow1: 200
        rightSafeDistance4Slow1: 200
        velocity4Slow1: 200
        deceleration4Slow1: 300
        ### slow down area 2
        frontSafeDistance4Slow2: 400
        backSafeDistance4Slow2: 100
        leftSafeDistance4Slow2: 100
        rightSafeDistance4Slow2: 100
        velocity4Slow2: 100
        deceleration4Slow2: 200
        ### obstacle Exclude area
        nearExcludeXmin: -500
        farExcludeXmax: 500
        rightExcludeYmin: -500
        leftExcludeYmax: 500
        lowDetectZmin: -2000
        highDetectZmax: 0
        # 空车状态下无效区的膨胀参数 单位mm
        expandExcludeArea: 0
        # 举升状态下无效区的膨胀参数 单位mm
        # 因顶起货架后，有可能不完全在中心，多加的安全距离
        expandExcludeAreaOnload: 100
        # 旋转时安全区的膨胀参数（空车/举升） 单位mm
        rotateSafeAreaOffset: 100
        # 进出货架时安全区的参数（空车） 单位mm
        accessContainerZmax: 180
        accessContainerZmax1500p: 50
        accessContainerX: 100
        accessContainerY: 20
        # 进出支架时安全区的参数 单位mm
        accessHolderZmax: 180
        accessHolderZmax1500p: 50
        accessHolderY: 20
        # 进出电梯时安全区的参数（空车） 单位mm
        accessElevatorX: 250
        accessElevatorY: 20
        # 判断货架与小车是否正交的角度误差值 单位degree
        relativeAngleAccuracy: 10
      rack:
        # 是否需要校验货码
        verifyRackCode: true
        # 是否传支架点上的货架模型
        hasBucketModel: true
      obstacleAvoidance:
        # 绕障不允许之后，重启申请的时间间隔 (ms)
        waitTimeMs: 3000
      recover:
        # 重新恢复后是否更新货架角度
        updatePayloadOri: true
      broadcast:
        # 语音播报曲目配置
        index: 1
        # 语音播报音量配置
        volume: 255
      lift:
        # 二维码模式下举升/下降是否发送目标点坐标
        liftWithGoalNode: false
      move:
        # 是否支持连续下发action
        continuousDeliveryCommand: false
        maxAngularVelocity: 1
        linearAcceleration: 1
        linearDeceleration: 1
        angularAcceleration: 40
        angularDeceleration: 40
        # 切换导航方式时是否停车
        switchNavStopRobot: true
        # 直线移动是否下发货架目标角度
        sendRackTargetAngle: false
        # 是否校验切换地图指令
        verifySwitchMap: false
      opportunity-charging:
        # 产生机会充电指令的空闲时长(s)
        timeout: 20
        # 小车和点位的距离误差 (m)
        poseErrorRange: 0.3
        # 机会充电启动充电下限
        chargingLowerLimit: 80.0
  ## cancel stop space
  cancel:
    stop:
      space: 3000

# kukas agv params
kukas:
  agv:
    params:
      netty:
        tcp:
          port: 8112
        udp:
          port: 8112
      virtualLineFollower:
        defaultTransAccuracy: 0.05
        defaultAngleAccuracyDeg: 1.0
        defaultTransGoalAccuracy: 0.025
        defaultAngleGoalAccuracyDeg: 0.5
      SplineMotion:
        trackingAccuracyTrans: 0.05
        trackingAccuracyRot: 0.05236
        accuracyTrans: 0.5
        accuracyRot: 0.0872665
      RelativeMotion:
        accuracyTransMin: 0.03
        accuracyRotMinDeg: 2.0
        transNormMin: 0
        transNormMax: 5
        rotNormMinDeg: 0
        rotNormMaxDeg: 180
      skillLift:
        liftTimeout: 300.0
      charge:
        chargeGrpcPort: 47254
        chargerModelName: 600s-2-charger
        chargerEntireRetryCount: 2
        chargerEnableProtectionFieldSetting: true
        chargerDelayProtectionFieldSettingChargeFinishMs: 20000
        chargerDelayProtectionFieldSettingNormalFinishMs: 5000
        chargerDelayDetectExecuteMs: 1000
        chargerDetectErrorRetryCount: 20
        chargerDetectMinX: -5
        chargerDetectMaxX: 0
        chargerDetectMinY: -1
        chargerDetectMaxY: 1
        chargerDetectTrustMinScore: 0.6
        chargerDetectTrustMinX: -2.5
        chargerDetectTrustMaxX: -0.5
        chargerDetectTrustMinY: -0.5
        chargerDetectTrustMaxY: 0.5
        chargerDetectTrustMaxAngleDegDeviation: 5
        chargerDetectMainAxisDistanceM: -0.58
        chargerDetectMinorAxisMaxOffsetM: 0.05
        chargerDetectRelativeMoveDistanceM: -0.2
        chargerTrackingGoalDistanceAccuracy: 0.05
        chargerTrackingGoalAngularAccuracy: 0.1
        chargerTrackingRecoverStartPoseMaxTrans: 0.5
        chargerTrackingRecoverStartPoseMaxRot: 1.0471975511965976
        chargerTrackingRecoverPathMaxTrans: 0.5
        chargerTrackingRecoverPathMaxRot: 1.0471975511965976
        chargerTrackingVelocity: 0.2
        chargerTrackingAngularVelocity: 0.2
        chargerDelayStartChargeMs: 3000
        chargerStartChargeErrorRetryCount: 3
        chargerFallbackGoalAngularAccuracyDeg: 80
        chargeWaitingTimeout: 60000
      stopCharge:
        stopChargeRelativeMotionDistance: 0.4
        stopChargeVirtualLineMotionEnable: false
      rack:
        isBlindCarry: true
        holderModelName: 600s-2-holder
        rackModelName: 600s-2-rack
        leaveHolderRelativeDistance: 1.0
        holderToTargetVelocity: 1.0
        rackTrackingVelocity: 0.2
        rackTrackingRecoverStartPoseMaxTrans: 0.5
        rackTrackingRecoverStartPoseMaxRot: 1.047
        rackTrackingRecoverPathMaxTrans: 0.5
        rackTrackingRecoverPathMaxRot: 1.047
        rackTrackingAngularVelocity: 0.2
        rackTrackingGoalDistanceAccuracy: 0.05
        rackTrackingGoalAngularAccuracy: 0.1
        rackDetectErrorRetryCount: 30
        rackDetectMainAxisDistanceM: 0
        rackDetectRelativeMoveDistanceM: 0.3
        rackDetectMinX: -5
        rackDetectMaxX: 5
        rackDetectMinY: -1.2
        rackDetectMaxY: 1.2
        rackDetectTrustMinX: 0.5
        rackDetectTrustMaxX: 2.5
        rackDetectTrustMinY: -0.5
        rackDetectTrustMaxY: 0.5
        rackDelayDetectExecuteMs: 200
        rackDetectMinorAxisMaxOffsetM: 0.2
        rackDetectRadianOffset: 0.2
        leavingRackDynamicDistance: 0.5
      move:
        stopWhenUnreliable: true
        stopWhenUndecided: false
      lift:
        retryMs: 30000
      protection:
        protectionGrpcPort: 47251
      safety:
        safetyGrpcPort: 5008
        specialCaseTimeoutLimit: 55000
        checkSafetyPort: 47260
        openProtectionFieldCheck: false
        checkSafetyTimes: 5000
      led:
        ledStripGrpcPort: 8995
      template:
        object-templates:
          - name: 600s-charger
