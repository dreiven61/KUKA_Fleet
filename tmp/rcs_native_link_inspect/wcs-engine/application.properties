ajaxCrossDomainUrl=http://127.0.0.1,http://localhost

spring.application.name=wcs

# active profiles db数据库连接   datasource 数据源配置
spring.profiles.include=db,datasource,ha,netty,grpc,custom

#应用端口号 8081
server.port=8081

# date类型序列化时转为timestamp
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=true
#json format配置
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone= ${TZ:Asia/Shanghai}

#应用上下文 wcs
server.servlet.context-path=/wcs

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

#是否启用swagger(没有引入starter依赖，只是使用相同key)
springfox.documentation.enabled=true


#liquibase相关
spring.liquibase.change-log=classpath:migration/changelogs.xml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false
spring.liquibase.contexts=application

#log4j2位置
logging.config=classpath:log4j2.xml

#base_data_service url
base_data_service_url = http://${BASIC_DATA_HTTP_HOST:127.0.0.1}:${BASIC_DATA_HTTP_PORT:7888}

#权限配置
kmres.authorization.enable=true
kmres.authorization.server.url=${AUTHORIZATION_HOST:127.0.0.1}:${AUTHORIZATION_PORT:8999}
kmres.authorization.rule.judge=false
kmres.authorization.db.modify=false

#操作记录配置
kmres.operation.record.enable=true
kmres.operation.record.server.url=${RECORD_HOST:localhost}:${RECORD_PORT:8999}
kmres.operation.record.server.moduleName=WCS

management.server.port=8280
management.endpoint.prometheus.enabled=true
management.endpoint.metrics.enabled=true
management.endpoints.web.base-path=/wcs-actuator
management.endpoints.web.exposure.include=*
management.metrics.tags.application=${spring.application.name}
#暂时取消redis健康监测，防止报错
management.health.redis.enabled=false

spring.messages.basename=messages/CustomMessages

#外部api地址维护
config.remote.call.apiCallBackUrl = http://${API_HTTP:202.107.242.12}:${API_PORT:8866}/dWCS-AGV-API/callBack_PTPLoad
config.remote.call.needCallBack = true

##################德玛项目订单回传URL地址###################################################
config.remote.call.pick-order-callback = http://${PICK_ORDER_URL:202.107.242.12}:${PICK_ORDER_PORT:8866}/dWCS-AGV-API/callBack

##################德玛项目订单任务机器人型号设置##############################################
#######德玛拣货订单 8背篓机器人型号
pick.order.robotType1 = HAIPICKA42
#######德玛拣货订单 4背篓机器人型号
pick.order.robotType2 = BasiclineA42-SLAM
#######德玛拣货订单 滚筒机器人型号
pick.order.robotType3 = KMP600I-1-T1
#######德玛点到点搬运任务 机器人型号
pick.order.robotType4 = KMP600I

#######德玛辊筒满箱任务中间节点（外部编码），控制节拍用
pick.order.rollerTask.MiddlePoint = middle-point




#################### MLS项目相关配置  按照实际场地情况配置#############################################
#############如果使用工厂为荆州云物流洗衣机项目，MLS对接，W01,W02,W04为点到点任务，此处为true,其他场地为false
mls.organization.for-jingzhou-washing-machine=true

#############Token获取##########################
####获取token的用户名/密码
####现场SIT环境 SCADA / SCADA@123
####现场UAT环境 HDRFID / RFID@MJ2
mls.callback.user=AGV
mls.callback.password=cde3@RFV


####获取token URL地址
####开发自测环境 http://localhost:80/token
####现场SIT环境 http://mlssitapi.midea.com/api-lmes/lmes/public/extSignIn
####现场UAT环境 http://mlsuatapi.midea.com/api-lmes/lmes/public/extSignIn
####现场PRD环境 http://mlsapi.midea.com/api-lmes/lmes/public/extSignIn
####合肥冰柜 http://mlssitapi.midea.com/api-lmes/lmes/public/extSignIn
mls.callback.url-for-token=http://localhost:80/token


##################任务节点回传URL地址 按照实际场地情况配置#############################################
####开发自测环境 http://localhost:80/api-lmes/lmes/public/sfcAGV/agvSchedulingTaskCallBack
####现场SIT环境 http://mlssitapi.midea.com/api-lmes/lmes/public/sfcAGV/agvSchedulingTaskCallBack
####现场UAT环境 http://mlsuatapi.midea.com/api-lmes/lmes/public/sfcAGV/agvSchedulingTaskCallBack
####现场PRD环境 http://mlsapi.midea.com/api-lmes/lmes/public/sfcAGV/agvSchedulingTaskCallBack
####合肥冰柜 http://mlssitapi.midea.com/api-lmes/lmes/public/sfcAGVIntelligentStock/agvSchedulingTaskCallBack
mls.callback.url-for-mission-callback=http://localhost:80/api-lmes/lmes/public/sfcAGV/agvSchedulingTaskCallBack


################ 辊筒提升机对应输送线取放货项目特有配置，非辊筒机器人场地不需要修改 ######################
# 提升机对应输送线设备编号集合
mls.roller.elevator-pipeline-code-list=fullout-1


################ 对于机器人型号为HCS-600I得机器人接口暴露的端口号信息 ###############################
config.remote.call.hcs.outerDevice.port = ${OUTER_DEVICE_PORT:9511}
config.remote.call.hcs.outerDevice.robotType = HCS-600I



################ 设备任务下发配置 ###############################
#重试次数上限
device.task.retry-limit=3
#重试间隔(单位：秒)
device.task.retry-interval=120
#重复设备交互任务进行重试处理
device.interaction.retry-repeat-task=true

################ spring初始化完毕后自动gc配置 ###############################
system.common.autoGCAfterInitialization=false
system.common.autoGCAfterInitialization.delay=10000


################ 规则相关 ###############################
#规则校验不通过，轮询间隔时间(ms)
workflow.rule.execute.retry_interval=1000

app.version = 2.15.0

# 任务下发线程池相关配置
task.dispatcher.move.corePoolSize=1
task.dispatcher.move.maximumPoolSize=10
task.dispatcher.command.corePoolSize=1
task.dispatcher.command.maximumPoolSize=10
task.dispatcher.rule.corePoolSize=1
task.dispatcher.rule.maximumPoolSize=10


#打印机器人推送
logRobot=false
#停止bd rob订阅
rob.bd.subscribe.disable=true