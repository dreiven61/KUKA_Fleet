#######################################################
# VID definition
#
# formats:
# ID   NAME    [<ALIAS_NAME, UNITS, VID_GROUP, VID_CONTENT_TYPE, [VID_FILTER], VID...>]
# ID   NAME    [<ALIAS_NAME, VID_GROUP, VID_CONTENT_TYPE, [VID_FILTER], VID...>]
# ID   NAME    [<VID_GROUP, VID_CONTENT_TYPE, [VID_FILTER], VID...>]
# 
# VID_FILTER is always optional
#
# supported VID_FILTER:
# - VidFilter.IS_NOT_SUB_TRANSFER_ID    filters (keep) all COMMAND variables that are not related to sub transfers
# - VidFilter.MAIN_TRANSFERS_ONLY       same as VidFilter.IS_NOT_SUB_TRANSFER_ID
# - VidFilter.IS_SUB_TRANSFER_ID        filters (keep) all COMMAND variables that are related to sub transfers
# - VidFilter.EQUAL_MAIN_TRANSFER_ID    filters (keep) all COMMAND variables that are sub transfers of the same main transfer
#
# Collection DataTypes:
# STRUCT: Smart variable which assembles a list of other variables from it's context. It 'unpacks' VariableArray variables.
#       If one of the referenced variables changes it's value then the struct's value changes accordingly. 
# LIST:  Smart Variable that collects all Variables in the system of a certain type. 
#       An example is the VID.ActiveVehicles which collects all vehicles currently in the system.
# ARRAY:  A list of variables. The variables in this array live in their own context (each) and have to be maintained 'manually'. 
#       Used for transfer commands which contain several TransferInfos / TransferInfosWithChangedDest.
#
# 

:VID
   1  AlarmID                         <ALARM, I4>
   6  ControlState                    <SYSTEM, B>
  51  CarrierId                       <CARRIER, A>
  52  CarrierLoc                      <CARRIER, A>
  55  CommandID                       <COMMAND, A>
  56  CommandInfo                     <COMMAND, STRUCT, CommandID, Priority, Replace>
  59  DestPort                        <COMMAND, A>
  80  Priority                        <COMMAND, U2>
  81  Replace                         <COMMAND, U2>
  83  ResultCode                      <COMMAND, U2>
  84  SourcePort                      <COMMAND, A>
  88  TransferInfo                    <COMMAND, STRUCT, CarrierId, SourcePort, DestPort>
  92  TSCState                        <SYSTEM, U2>
  98  VehicleID                       <VEHICLE, A>
1001  ActiveCarriers                  <SYSTEM, LIST, CarrierInfo>
1002  ActiveTransfers                 <SYSTEM, LIST, VidFilter.MAIN_TRANSFERS_ONLY, TransferCommand>
1003  ActiveVehicles                  <SYSTEM, LIST, VehicleInfo>
1100  CarrierInfo                     <CARRIER, STRUCT, CarrierId, VehicleID, CarrierLoc>
1200  EqpName                         <SYSTEM, A>
1201  TransferPort                    <VEHICLE, A>
1202  TransferPortList                <VEHICLE, STRUCT, TransferPort>
1300  VehicleType                     <VEHICLE, U2>
1301  ActiveVehicleType               <SYSTEM, LIST, VehicleInfoType>
1302  VehicleState                    <VEHICLE, U2>
1400  AlarmMessage                    <ALARM, A>
1401  AlarmSourceModuleID             <ALARM, A>
1402  AlarmReportingUnit              <ALARM, A>
1403  AlarmSetClear                   <ALARM, A>
1404  AlarmPriority                   <ALARM, I2>
1405  AlarmModuleDataUUID             <ALARM, A>
1500  VehiclePos                      <VEHICLE, U4>
2000  TransferCommand                 <COMMAND, STRUCT, CommandInfo, TransferInfos>
2001  TransferCommandRaw              <COMMAND, DATA>
2002  TransferInfos                   <COMMAND, ARRAY, TransferInfo>
2003  TransferState                   <COMMAND, U2>
2004  VehicleBatteryLevel             <VEHICLE, U2>
2005  VehicleInfo                     <VEHICLE, STRUCT, VehicleID, VehicleState>
2006  VehicleInfoType                 <VEHICLE, STRUCT, VehicleID, VehicleState, VehicleType>
2007  VehicleStatus                   <VEHICLE, U2>
2008  TSAvail                         <SYSTEM, U2>
2009  MasterControlEqpName            <SYSTEM, A>
2010  ModuleServiceModeList           <SYSTEM, DATA>
2011  StageId                         <COMMAND, A>
2012  TransferInfoWithCarrierLoc      <COMMAND, STRUCT, TransferInfo, CarrierLoc>
2013  TransferInfosWithCarrierLoc     <COMMAND, LIST, VidFilter.EQUAL_MAIN_TRANSFER_ID, TransferInfoWithCarrierLoc>
2014  TransferInfosWithChangedDest    <COMMAND, ARRAY, TransferInfo>
3000  CLOCK                           <SYSTEM, CLOCK>
3001  TimeFormat                      <SYSTEM, U2>


#######################################################
# INITIAL_VALUES definition
# when querying variables to which no value has been set before, then the value defined here will be returned.
# currently, the only supported value types are Strings, (non floating point) Numbers and SML data.
# when the given Vid represents a CLOCK type, then a value of -1 will initialize that clock variable to the current system time. 
# strings may be enclosed by "". If so, these enclosing characters will be removed. 
# If the String should contain quotes at the beginning and end, either use double quotes (""String"") or escape them (\"String\"). 
#
# format:
# VID    VALUE
#

:INITIAL_VALUES
Vid.CLOCK       -1
Vid.CarrierLoc  "UNKNOWN"
Vid.EqpName     "FLEET"
Vid.TimeFormat  2


