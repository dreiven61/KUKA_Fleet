syntax = "proto3";

package kuka.common.battery.v1;

import "kuka/common/battery/v1/battery_state.proto";

option csharp_namespace = "Kuka.Common.Battery.V1";
option java_multiple_files = true;
option java_outer_classname = "BatteryStateLayerProto";
option java_package = "com.kuka.common.battery.v1";

// A message represents a battery state layer.
message BatteryStateLayer
{
  reserved 2;
  // A field represents the node properties.
  map<string, BatteryState> node_properties = 1;
}
