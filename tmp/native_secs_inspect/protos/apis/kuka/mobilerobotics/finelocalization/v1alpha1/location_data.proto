syntax = "proto3";

package kuka.mobilerobotics.finelocalization.v1alpha1;

import "kuka/mobilerobotics/finelocalization/v1alpha1/location.proto";

option java_package = "com.kuka.mobilerobotics.finelocalization.v1alpha1";
option java_outer_classname = "LocationDataProto";
option java_multiple_files = true;

// Contains a list of locations. See "Location" for more information.
message LocationData
{
  repeated Location locations = 1;
}
