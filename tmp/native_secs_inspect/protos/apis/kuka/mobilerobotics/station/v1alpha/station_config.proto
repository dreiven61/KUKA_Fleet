syntax = "proto3";

package kuka.mobilerobotics.station.v1alpha;

option csharp_namespace = "Kuka.Mobilerobotics.Station.V1alpha";
option java_multiple_files = true;
option java_outer_classname = "StationConfigProto";
option java_package = "com.kuka.mobilerobotics.station.v1alpha";

// Represents a station (safety) configuration.
message StationConfig
{
  // Positive, not 0 safe id number.
  uint32 safe_id = 1;

  // Sets whether the safe position detection shall be active
  bool is_safe_position_detection_active = 2;
}
