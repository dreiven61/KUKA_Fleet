syntax = "proto3";

package kuka.mobilerobotics.station.v1alpha1;

import "kuka/mobilerobotics/station/v1alpha1/station.proto";

option java_package = "com.kuka.mobilerobotics.station.v1alpha1";
option java_outer_classname = "StationDataProto";
option java_multiple_files = true;

// Contains a list of Stations.
// When this data is received from a subscribe call on the data provider, the station objects only contain a UUID.
// When this data is received from a get call, the station objects contain the full data.
message StationData
{
  repeated Station stations = 1;
}
