syntax = "proto3";

package kuka.mobilerobotics.objects.v1alpha1;

import "kuka/core/geometry/v1/repeated_shape_2d.proto";

option java_package = "com.kuka.mobilerobotics.objects.v1alpha1";
option java_outer_classname = "Shape2DLayersProto";
option java_multiple_files = true;

// An Shape2DLayers contains different named layers. Each layer consists out of 2d shapes describing the geometric form of this layer.
// examples for names that are used layer : detectionModel, freespaceModel, footprintModel, maskingModel
message Shape2DLayers
{
    map<string, kuka.core.geometry.v1.RepeatedShape2D> shapes=1;
}
