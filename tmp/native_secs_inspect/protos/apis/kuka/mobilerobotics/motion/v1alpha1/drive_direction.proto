syntax = "proto3";

package kuka.mobilerobotics.motion.v1alpha1;

option java_package = "com.kuka.mobilerobotics.motion.v1alpha1";
option java_outer_classname = "DriveDirectionProto";
option java_multiple_files = true;

// Defines the drive direction of the AGV.
message DriveDirection
{
  DirectionType direction = 1;

  enum DirectionType
	{
    // Unspecified drive direction. This should not be used.
    UNSPECIFIED = 0;

    // The AGV drives in forward direction, i.e. it has the same
    // orientation as the path tangent of a path.
    FORWARD = 1;

    // The AGV drives in backward direction, i.e. it has an
    // orientation rotated by 180 degrees relative to the path tangent
    // of a path.
    BACKWARD = 2;
  }
}
