syntax = "proto3";

package kuka.mobilerobotics.motion.v1alpha1;

import "google/protobuf/wrappers.proto";

option java_package = "com.kuka.mobilerobotics.motion.v1alpha1";
option java_outer_classname = "GoalAccuracyProto";
option java_multiple_files = true;

// The goal accuracy that needs to be respected at the end of a motion.
message GoalAccuracy
{
  // The maximum allowed translational difference (in meters) at the goal.
  // If this value is not provided, then a platform-specific default parameter
  // will be used.
  // Optional.
  google.protobuf.DoubleValue translational_goal_accuracy = 1;
	
  // The maximum allowed rotational difference (in radians) at the goal.
  // If this value is not provided, then a platform-specific default parameter
  // will be used.
  // Optional.
  google.protobuf.DoubleValue rotational_goal_accuracy = 2;
}
