syntax = "proto3";

package kuka.mobilerobotics.robotmanager.v1alpha1;

import "kuka/mobilerobotics/robotmanager/v1alpha1/robot.proto";

option java_package = "com.kuka.mobilerobotics.robotmanager.v1alpha1";
option java_outer_classname = "RobotDataProto";
option java_multiple_files = true;

// Contains a list of the robot controller registration messages.
message RobotData
{
  repeated Robot robots = 1;
}

