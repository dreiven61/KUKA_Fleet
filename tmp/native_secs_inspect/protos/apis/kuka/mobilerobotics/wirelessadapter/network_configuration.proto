syntax = "proto3";

package kuka.mobilerobotics.wirelessadapter;

option csharp_namespace = "Kuka.Mobilerobotics.Wirelessadapter";
option java_multiple_files = true;
option java_outer_classname = "NetworkConfigurationProto";
option java_package = "com.kuka.mobilerobotics.wirelessadapter";

// The actual connected wireless network details.
message NetworkConfiguration
{
  // IP address of the connected device.
  string ip_address = 1;

  // Subnet mask.
  string subnet_mask = 2;

  // SSID of the connected wireless network.
  string ssid = 3;
}