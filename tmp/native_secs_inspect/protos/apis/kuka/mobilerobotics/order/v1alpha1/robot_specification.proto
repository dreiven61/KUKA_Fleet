syntax = "proto3";

package kuka.mobilerobotics.order.v1alpha1;

import "google/protobuf/wrappers.proto";

option java_package = "com.kuka.mobilerobotics.order.v1alpha1";
option java_outer_classname = "RobotSpecificationProto";
option java_multiple_files = true;

// Specifies robot properties of an order.
message RobotSpecification
{
  // The uuid of the robot that transfers a payload.
  string robot_uuid = 1;

  // The uuid of the robot's compartment in which the payload is transported. 
  // [optional] If not specified, the compartment weight determines where the payload is placed.
  google.protobuf.StringValue compartment_uuid = 2;
}
