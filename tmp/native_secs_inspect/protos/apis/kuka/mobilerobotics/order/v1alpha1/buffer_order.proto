syntax = "proto3";

package kuka.mobilerobotics.order.v1alpha1;

import "kuka/mobilerobotics/order/v1alpha1/payload_specification.proto";
import "kuka/mobilerobotics/order/v1alpha1/robot_specification.proto";
import "kuka/mobilerobotics/order/v1alpha1/station_specification.proto";

option java_package = "com.kuka.mobilerobotics.order.v1alpha1";
option java_outer_classname = "BufferOrderProto";
option java_multiple_files = true;

// An order that transfers a payload to a buffer station.
message BufferOrder
{
  // Specifies the payload to be transported.
  PayloadSpecification payload = 1;

  // Specifies where the payload must be dropped. 
  // [optional] If not specified, a suitable buffer station is chosen automatically.
  // If the target is not a buffer station, the order fails.
  StationSpecification target = 2;

  // Specifies the robot that must transfer the payload.
  // [optional] If not specified, a suitable robot is chosen automatically.
  // If the robot's compartment is already used by a different payload, the order fails.
  RobotSpecification robot = 3;
}
