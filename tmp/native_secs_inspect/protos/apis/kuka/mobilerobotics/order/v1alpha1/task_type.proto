syntax = "proto3";

package kuka.mobilerobotics.order.v1alpha1;

option java_package = "com.kuka.mobilerobotics.order.v1alpha1";
option java_outer_classname = "TaskTypeProto";
option java_multiple_files = true;

// Defines the type of a task.
message TaskType
{
  enum Enum 
  {
    // The type is unspecified.
    UNSPECIFIED = 0;

    // Relocates a payload from a station onto a robot.
    PICK = 1;

    // Relocates a payload from a robot onto a station.
    DROP = 2;
  }

  Enum task_type = 1;
}
