syntax = "proto3";

package kuka.mobilerobotics.order.events.v1alpha1;

import "kuka/mobilerobotics/order/events/v1alpha1/command_id_specification.proto";

option java_package = "com.kuka.mobilerobotics.order.events.v1alpha1";
option java_outer_classname = "CommandSpecificationProto";
option java_multiple_files = true;

// Specifies a SECS command.
message CommandSpecification
{
  oneof command
  {
    // Refers to an action UUID
    string action_uuid = 1;
	
    // Refers to a SECS command by ID and Sub-ID
    CommandIdSpecification command_id_specification = 2;
  }
}

