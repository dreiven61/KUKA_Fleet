syntax = "proto3";

package kuka.mobilerobotics.order.events.v1alpha1;

import "kuka/mobilerobotics/order/events/v1alpha1/command_specification.proto";

option java_package = "com.kuka.mobilerobotics.order.events.v1alpha1";
option java_outer_classname = "AbortingEventProto";
option java_multiple_files = true;

// Abortion of a command, handled by a vehicle, is ongoing.
message AbortingEvent {

  // the vehicle ID
  string vehicle_id = 1;

  // Specifies the command this event refers to
  // If this event is part of an action runtime update, then this field is not required
  CommandSpecification command_specification = 2;

  // the alternative destination port that will be used to drop the payload, if applicable
  string alternative_equipment_port_id = 3;
}
