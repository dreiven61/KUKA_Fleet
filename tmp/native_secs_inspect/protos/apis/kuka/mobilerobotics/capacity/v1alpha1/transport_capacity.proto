syntax = "proto3";

package kuka.mobilerobotics.capacity.v1alpha1;

import "kuka/mobilerobotics/capacity/v1alpha1/transport_compartment.proto";

option java_package = "com.kuka.mobilerobotics.capacity.v1alpha1";
option java_outer_classname = "TransportCapacityProto";
option java_multiple_files = true;

// Describes the capability of robots to transport payloads.
message TransportCapacity {

  // The compartments in the cargo space where payloads can be placed.
  repeated TransportCompartment compartments = 1;

}
