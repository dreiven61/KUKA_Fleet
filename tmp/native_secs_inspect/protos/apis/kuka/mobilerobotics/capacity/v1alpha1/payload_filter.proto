syntax = "proto3";

package kuka.mobilerobotics.capacity.v1alpha1;

option java_package = "com.kuka.mobilerobotics.capacity.v1alpha1";
option java_outer_classname = "PayloadFilterProto";
option java_multiple_files = true;

// Defines filters for payloads, to restrict what payload can be put in a compartment.
message PayloadFilter {

  // Accept only payloads of these types, usually because of physical dimensions.
  repeated string type_uuids = 1;

}
