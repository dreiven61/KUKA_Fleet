syntax = "proto3";

package kuka.mobilerobotics.motioncontrol.dataprovider.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Kuka.MobileRobotics.MotionControl.DataProvider.V1";
option java_multiple_files = true;
option java_outer_classname = "LatestMotionDataProto";
option java_package = "com.kuka.mobilerobotics.motioncontrol.dataprovider.v1";

// message to send data about the latest successful motion
message LatestMotionData
{
  // Timestamp of the latest successful motion
  google.protobuf.Timestamp timestamp = 1;
  // UUID of the latest successful motion
  string uuid = 2;
}
