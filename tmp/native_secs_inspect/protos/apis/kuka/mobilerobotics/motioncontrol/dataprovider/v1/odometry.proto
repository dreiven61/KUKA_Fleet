syntax = "proto3";

package kuka.mobilerobotics.motioncontrol.dataprovider.v1;

import "google/protobuf/timestamp.proto";
import "kuka/core/geometry/v1/transform_2d.proto";
import "kuka/core/geometry/v1/velocity_2d.proto";

option csharp_namespace = "Kuka.MobileRobotics.MotionControl.DataProvider.V1";
option java_multiple_files = true;
option java_outer_classname = "OdometryProto";
option java_package = "com.kuka.mobilerobotics.motioncontrol.dataprovider.v1";

// Contains odometry information of a mobile robot.
message Odometry
{
  // A timestamp as close as possible to the source of the contained data.
  google.protobuf.Timestamp timestamp = 1;

  // (x, y, theta) odometry pose of the mobile robot, in meters.
  kuka.core.geometry.v1.Transform2D pose = 2;

  // (x, y, theta) odometry velocity of the mobile robot. Respectively in m/s, m/s and rad/s.
  kuka.core.geometry.v1.Velocity2D velocity = 3;
}
