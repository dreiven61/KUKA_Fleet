syntax = "proto3";

package kuka.mobilerobotics.acoustic.dataprovider.v1alpha1;

option csharp_namespace = "Kuka.MobileRobotics.Acoustic.DataProvider.V1alpha1";
option java_multiple_files = true;
option java_outer_classname = "SignalTypeDataProto";
option java_package = "com.kuka.mobilerobotics.acoustic.dataprovider.v1alpha1";

// message to send data about the supported custom acoustic signal types
message SignalTypeData
{
  // Types of supported custom acoustic signals 
  repeated string types = 1;
}
