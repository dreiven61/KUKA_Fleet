syntax = "proto3";

package kuka.mobilerobotics.acoustic.actionexecutor.v1alpha1;

option csharp_namespace = "Kuka.MobileRobotics.Acoustic.ActionExecutor.V1alpha1";
option java_multiple_files = true;
option java_outer_classname = "VolumeOverrideActionProto";
option java_package = "com.kuka.mobilerobotics.acoustic.actionexecutor.v1alpha1";

// Action to override the default volume setting
message VolumeOverrideAction
{
  // The precentage of the new volume between 0% to 100% and 65dB to 118dB
  int32 volume = 1;
}
