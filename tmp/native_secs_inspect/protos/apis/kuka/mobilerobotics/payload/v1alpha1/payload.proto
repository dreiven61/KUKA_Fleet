syntax = "proto3";

package kuka.mobilerobotics.payload.v1alpha1;

option java_package = "com.kuka.mobilerobotics.payload.v1alpha1";
option java_outer_classname = "PayloadProto";
option java_multiple_files = true;

// Contains the description of a payload.
message Payload {

  // The payload's unique identifier.
  string uuid = 1;

  // specific type of payload
  string type_uuid = 2;

  // current location, e.g. robot or station, and the concrete compartment
  // [optional]
  PayloadLocation payload_location = 3;
}

// The current location of a payload.
message PayloadLocation {

  // a payload can be in a station or on a robot
  oneof location {
    // robot uuid if the payload is on robot
    string robot_uuid = 1;

    // station uuid if the payload is in a station
    string station_uuid = 2;
  }

  // compartment uuid
  string compartment_uuid = 3;
}