syntax = "proto3";

package kuka.mobilerobotics.payload.v1alpha1;

import "google/protobuf/any.proto";

option java_package = "com.kuka.mobilerobotics.payload.v1alpha1";
option java_outer_classname = "PayloadTypeProto";
option java_multiple_files = true;

// Contains a payload type
message PayloadType {

  // The payload type uuid
  string uuid = 1;

  // the load data, e.g. size
  repeated google.protobuf.Any data = 2;
}