syntax = "proto3";

package kuka.mobilerobotics.applicationcontrol;

import "kuka/mobilerobotics/applicationcontrol/application_control_parameters.proto";

option csharp_namespace = "Kuka.MobileRobotics.ApplicationControl";
option java_multiple_files = true;
option java_outer_classname = "ExecuteApplicationActionProto";
option java_package = "com.kuka.mobilerobotics.applicationcontrol";

// Proto describing a command to start an application
message ExecuteApplicationAction
{
  // The name of the application to execute.
  string application_name = 1;

  // The parameters of the application about to be executed.
  ApplicationControlParameters parameters = 2;
}
