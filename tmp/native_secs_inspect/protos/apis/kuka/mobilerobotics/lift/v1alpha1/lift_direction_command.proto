syntax = "proto3";

package kuka.mobilerobotics.lift.v1alpha1;

import "google/protobuf/wrappers.proto";

option java_package = "com.kuka.mobilerobotics.lift.v1alpha1";
option java_outer_classname = "LiftDirectionCommandProto";
option java_multiple_files = true;

message LiftDirectionCommand
{
   enum Direction
   {
      // Unknown lift direction
      NOT_SPECIFIED = 0;
      
      // Move the lift downwards
      DOWN = 1;
      
      // Move the lift upwards
      UP = 2;
   }
	// Drive upwards or downwards
   Direction direction = 1;

   // Optional: Velocity along the lift height axis (in m/s)
	google.protobuf.DoubleValue velocity = 2;
}