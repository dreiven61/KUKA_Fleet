syntax = "proto3";

package kuka.mobilerobotics.graph.v1alpha1;

import "google/protobuf/wrappers.proto";
import "kuka/mobilerobotics/graph/v1alpha1/motion_orientation.proto";
import "kuka/mobilerobotics/fleetmanager/v1alpha1/graph_motion_action_description.proto";

option java_package = "com.kuka.mobilerobotics.graph.v1alpha1";
option java_outer_classname = "EdgeActionPropertyProto";
option java_multiple_files = true;

// Defines mobile robotics specific parameters of custom edge actions (e.g., additional costs).
message EdgeActionProperty 
{
  // Defines the allowed goal orientations in radians. The orientation can be set relative to map or edge (or both). 
  MotionOrientation motion_orientation = 1;

  // list of actions which should be executed on the edge which contains this property
  repeated kuka.mobilerobotics.fleetmanager.v1alpha1.GraphMotionActionDescription actions = 2;

}