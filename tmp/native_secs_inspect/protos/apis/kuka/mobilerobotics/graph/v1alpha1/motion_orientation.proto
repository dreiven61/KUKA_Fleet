syntax = "proto3";

package kuka.mobilerobotics.graph.v1alpha1;

option java_package = "com.kuka.mobilerobotics.graph.v1alpha1";
option java_outer_classname = "MotionOrientationProto";
option java_multiple_files = true;

// Definition of the allowed motion orientations which can be set for an edge.
message MotionOrientation
{
  // Allowed orientations on the edge in radians.
  // These orientations are set relatively to the reference frame 
  // orientation (map).
  repeated double orientations_radians = 1;
    
  // Allowed orientations on the path in radians.
  // These orientations are set relatively to the path tangent (edge).
  repeated double path_orientations_radians = 2;
}
