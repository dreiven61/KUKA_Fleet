syntax = "proto3";

package kuka.mobilerobotics.graph.v1alpha1;


option java_package = "com.kuka.mobilerobotics.graph.v1alpha1";
option java_outer_classname = "TopologyNodeReferenceProto";
option java_multiple_files = true;

// Defines a reference to a topology node.
message TopologyNodeReference
{
  // The uuid of the graph containig the topology node.
  string graph_uuid = 1;
	
  // The topology node uuid.
  string node_uuid = 2; 
}
