syntax = "proto3";

package kuka.mobilerobotics.graph.v1alpha1;

option java_package = "com.kuka.mobilerobotics.graph.v1alpha1";
option java_outer_classname = "MotionBlendingPropertyProto";
option java_multiple_files = true;

// Definition of the motion blending cart which can be set on 
// an edge or a target node. If blending is set on an edge and 
// on the target node of this edge, the blending cart of the 
// edge is used.
message MotionBlendingProperty
{
  // Describes the distance from the blending point to the 
  // motion target in meters.
  double blending_cart_meters = 1;
}