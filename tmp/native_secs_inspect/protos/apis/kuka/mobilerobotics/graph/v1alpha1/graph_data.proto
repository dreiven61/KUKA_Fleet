syntax = "proto3";

package kuka.mobilerobotics.graph.v1alpha1;

import "kuka/mobilerobotics/graph/v1alpha1/topology_graph.proto";

option java_package = "com.kuka.mobilerobotics.graph.v1alpha1";
option java_outer_classname = "GraphDataProto";
option java_multiple_files = true;

// The graph data for getting all topology graphs.
message GraphData
{
  // Defines a list of topology graphs. 
  repeated TopologyGraph topology_graphs = 1;
}
