syntax = "proto3";

package kuka.mobilerobotics.graph.v1alpha1;

import "kuka/mobilerobotics/motion/v1alpha1/motion_recovery.proto";

option java_package = "com.kuka.mobilerobotics.graph.v1alpha1";
option java_outer_classname = "MotionRecoveryPropertyProto";
option java_multiple_files = true;


// Definition of the motion recovery which can be set for a node or edge.
message MotionRecoveryProperty
{ 
  // The maximum translational distance for recovery in meters.
  // The value must be greater than or equal to 0.
  // The maximum rotational difference for recovery in radians.
  // This value must be within the range [0.0, pi].
  kuka.mobilerobotics.motion.v1alpha1.MotionRecovery recovery = 1;
}