syntax = "proto3";

package kuka.mobilerobotics.graph.v1alpha1;

import "google/protobuf/wrappers.proto";

option java_package = "com.kuka.mobilerobotics.graph.v1alpha1";
option java_outer_classname = "MotionOrientationModePropertyProto";
option java_multiple_files = true;


// Definition of the motion orientation mode which can be set 
// for a node or an edge.
message MotionOrientationModeProperty
{
  // Defines whether rotation is allowed on the node or edge.
  google.protobuf.BoolValue allow_rotation = 1;
}