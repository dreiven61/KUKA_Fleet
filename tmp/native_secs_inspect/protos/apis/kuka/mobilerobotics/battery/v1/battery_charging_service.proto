syntax = "proto3";

package kuka.mobilerobotics.battery.v1;

import "kuka/core/v1/message_header.proto";

option csharp_namespace = "Kuka.MobileRobotics.Battery.V1";
option java_multiple_files = true;
option java_outer_classname = "BatteryChargingCommandServiceProto";
option java_package = "com.kuka.mobilerobotics.battery.v1";

// device: BatteryCharger (CommandExecutor)
// interface name: BatteryCharging

// Provides methods for enabling and disabling charging of a battery.
service BatteryChargingCommandService
{
  // Starts the charging process.
  rpc StartCharging(StartChargingRequest) returns (StartChargingResponse);
  
  // Stops the charging process.
  rpc StopCharging(StopChargingRequest) returns (StopChargingResponse);

  // Provides the current state of the battery charging service, 
  // e.g. indicates whether battery is ready to charge.
  rpc GetBatteryChargingState(GetBatteryChargingStateRequest) returns (BatteryChargingState);
  
  // Provides a stream of the current state of the battery charging service, 
  // e.g. indicates whether battery is ready to charge.
  // On each change a new message is emitted.
  rpc SubscribeBatteryChargingState(SubscribeBatteryChargingStateRequest) returns (stream BatteryChargingState);
}

// GetBatteryChargingStateRequest
message GetBatteryChargingStateRequest
{
  // empty
}

// SubscribeBatteryChargingStateRequest
message SubscribeBatteryChargingStateRequest
{
  // empty
}

// BatteryChargingState
message BatteryChargingState
{
  // The header of the message.
  kuka.core.v1.MessageHeader header = 1;
  
  // Indicates whether charging can be started.
  bool is_ready_to_charge = 2;
}

// StartChargingRequest
message StartChargingRequest
{
  // empty
}

// StartChargingResponse
message StartChargingResponse
{
  // empty
}

// StopChargingRequest
message StopChargingRequest
{
  // empty
}

// StopChargingResponse
message StopChargingResponse
{
  // empty
}
