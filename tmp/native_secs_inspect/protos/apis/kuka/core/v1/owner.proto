syntax = "proto3";

package kuka.core.v1;

option java_package = "com.kuka.core.v1";
option java_outer_classname = "OwnerProto";
option java_multiple_files = true;


// Contains an identifier for a module / component.
message Owner
{
  // The id of this owner.
  string id = 1;
}
