syntax = "proto3";

package kuka.core.geometry.v1;

option java_package = "com.kuka.core.geometry.v1";
option java_outer_classname = "CircleProto";
option java_multiple_files = true;


// Represents a circle in 2D space with
// its center located at (0, 0).
message Circle
{
  // The radius of the circle.
  double radius = 1;
}
