syntax = "proto3";

package kuka.core.geometry.v1;

import "kuka/core/geometry/v1/vector.proto";

option java_package = "com.kuka.core.geometry.v1";
option java_outer_classname = "PolygonProto";
option java_multiple_files = true;


// A specification of a polygon where the first and
// last points are assumed to be connected.
message Polygon
{
  repeated Vector points = 1;
}