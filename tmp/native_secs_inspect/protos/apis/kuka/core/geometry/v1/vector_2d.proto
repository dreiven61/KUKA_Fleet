syntax = "proto3";

package kuka.core.geometry.v1;

option java_package = "com.kuka.core.geometry.v1";
option java_outer_classname = "Vector2DProto";
option java_multiple_files = true;


// Represents a vector in 2D space.
message Vector2D
{
  double x = 1;
  double y = 2;
}