syntax = "proto3";

package kuka.database.v1alpha1;

import "google/protobuf/any.proto";

option java_package = "com.kuka.database.v1alpha1";
option java_outer_classname = "ManageDataCommandTypeProto";
option java_multiple_files = true;

// To Manage a data element in the corresponding service. 
// A command is provided in the following way:
// 
// message Manage[Sometype]DataCommand{
//      ManageDataCommandType type;
//      Sometype              data;
// }
// The ManageDataCommandType is the selector which tells this service to import, update and delete a data entry.
enum ManageDataCommandType
{
  // If this type is set, this command is discarded. No changes are applied.
  UNSPECIFIED = 0;

  // Imports data into the service.
  // If a data UUID was not provided, then one is created.
  INSERT = 1;

  // Applies new data to the referenced data, whose UUID is used to find the corresponding data to modify.
  // If no data with such UUID is found, then this action fails.
  UPDATE = 2;

  // Deletes the data referenced by the "data"'s UUID.
  // The content of "data" does not have to contain the actual data.
  DELETE = 3;
}
