syntax = "proto3";

package kuka.controller.v1alpha1;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.kuka.controller.v1alpha1";
option java_outer_classname = "CommandProto";
option java_multiple_files = true;

// Represents a command that can be processed by the controller service.
message Command {
  // The timestamp corresponding to the time of the creation of this command.
  google.protobuf.Timestamp timestamp = 1;

  // The estimated total duration of the command.
  google.protobuf.Duration estimated_duration = 2;

  // The actual command with all its parameters (e.g. service specific command message).
  google.protobuf.Any command = 3;
}
