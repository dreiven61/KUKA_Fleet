syntax = "proto3";

package kuka.diagnostics.version.v1;

option csharp_namespace = "Kuka.Diagnostics.Version.V1";
option java_multiple_files = true;
option java_outer_classname = "VersionInfoProto";
option java_package = "com.kuka.diagnostics.version.v1";

// A version info block.
message VersionInfo
{
  // The name of the component (service).
  string component_name = 1;
  // The version of the component (service).
  string component_version = 2;
}

// A collection of version info blocks.
message VersionInfos
{
  // A collection of VersionInfo blocks.
  repeated VersionInfo versionInfos = 1;
}
