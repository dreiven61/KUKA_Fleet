syntax = "proto3";

package kuka.diagnostics.messaging.v1;

option java_multiple_files = true;
option java_outer_classname = "SeverityProto";
option java_package = "com.kuka.diagnostics.messaging.v1";

// This enum maps nearly 1:1 to the severity of the PRI part of a syslog entry
// https://tools.ietf.org/html/rfc5424#section-6.2.1
// The only difference is the MESSAGE_LEVEL_UNDEFINED enum entry to circumvent
// the restrictions imposed by protobuf3
enum Severity {
  // Severity level is not explicitly specified
  SEVERITY_UNSPECIFIED = 0;

  // System is unusable
  EMERGENCY = 1;

  // Action must be taken immediately
  ALERT = 2;

  // Critical conditions
  CRITICAL = 3;

  // Error conditions
  ERROR = 4;

  // Warning conditions
  WARNING = 5;

  // Normal but significant condition
  NOTICE = 6;

  // Informational messages
  INFORMATIONAL = 7;

  // Debug-level messages
  DEBUG = 8;
}
