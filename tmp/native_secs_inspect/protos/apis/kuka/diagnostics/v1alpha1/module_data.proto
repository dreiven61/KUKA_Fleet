syntax = "proto3";

package kuka.diagnostics.v1alpha1;

import "google/protobuf/any.proto";
import "kuka/diagnostics/messaging/v1/localizable_text.proto";
import "kuka/diagnostics/messaging/v1/message.proto";
import "kuka/core/state/v1/error_state.proto";
import "kuka/core/state/v1/warning_state.proto";

option java_package = "com.kuka.diagnostics.v1alpha1";
option java_outer_classname = "ModuleDataProto";
option java_multiple_files = true;

// Represents the state of a module.
message ModuleData
{
  enum State
    {
    // The module state is unknown.
    UNKNOWN = 0;

    // The module was created and has not been initialized yet.
    CREATED = 1;

    // The module is starting.
    INITIALIZING = 2;

    // The module started and is reachable.
    RUNNING = 3;

    // The module is disposing.
    STOPPING = 4;

    // The module is stopped, but still registered to this service
    STOPPED = 5;
  }

  // The current state of the module.
  State state = 1;

  // If applicable, contains a more specialized state for this module
  google.protobuf.Any substate = 2;

  // The current state of the error state machine.
  kuka.core.state.v1.ErrorState error_state = 3;

  // The current state of the warning state machine.
  kuka.core.state.v1.WarningState warning_state = 4;
  
  // Optional. The identifier of the module as defined by the publishing component.
  // On user interfaces this will be used to reference the module with.
  // If omitted, ID will be generated from the publisher ID of message_header.
  // Format:  "<component_name>/<StatePortName>"
  // Example: "mr_control/MotionControlStatePort"
  string module_id = 5;
  
  // Optional. The human-readable description of the module state.
  // This text will be shown in the title column of the stateports view.
  kuka.diagnostics.messaging.v1.LocalizableText module_description = 6;
  
  // Optional. Additional message from the module.
  // Messages will be added as child_states to the stateport and shown in description column.
  repeated kuka.diagnostics.messaging.v1.Message messages = 7;
}
