syntax = "proto3";

package battery.management.v1;

import "google/protobuf/any.proto";

option java_package = "com.battery.management.v1";
option java_outer_classname = "GlobalDefinitions";
option java_multiple_files = true;

// Operation Mode enumeration
enum OperationMode
{
   OFF = 0;
   SLEEP = 1;
   STANDBY = 2;
   CHARGE_ONLY_INDUCTIVE = 3;
   CHARGE_ONLY_EXTERNAL = 4;
   ON = 5;
}