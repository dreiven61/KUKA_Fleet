# Sunrise cabinet configuration
controller.ip=0.0.0.0
controller.grpc.port=50051

# Navbox configuration
navbox.ip=0.0.0.0
navbox.bifrost.port=5050

# Mobile robot serial number
# Only needs to be configured, if fetching the robot's real serial number should be bypassed or if the robot's real serial number should be overridden
officeMode.serial.number=

# YAML file containing backend services configuration
backend.services.yaml=/opt/robot/config/robot-controller-config.yml

# YAML file containing backend motion defaults
backend.motion.defaults.yaml=/opt/robot/config/motions.yml

# Allows to configure the name being used for the safety source representing a protection field
# Search is performed case-insensitive and by partial matching. So if there's two safety sources "Protection Field 1"
# and "Protection Field 2", setting "backend.safety.source.protection.field=protection field" will match both safety
# sources and take them into consideration.
# Defaults to "protection field".
backend.safety.source.protection.field=

# Allows to configure frequencies to be used when subscribing to the backend services for collecting robot state.
backend.subscription.frequency.BatteryState=0.01
backend.subscription.frequency.LocalizerData=5.0
backend.subscription.frequency.Odometry=5.0
backend.subscription.frequency.SafetyState=0.0
backend.subscription.frequency.SafetyStatus=0.0

# for testing purposes: enable an unencrypted websocket listener on the mqtt broker!
mqtt.broker.url=ws://mqtt-broker:9001
mqtt.rootTopic=uagv/v2/KUKA/
mqtt.user=
mqtt.password=

# Nav DB configuration
db.url=jdbc:h2:mem:NavBaseDB;DB_CLOSE_DELAY=-1
db.user=
db.password=

# Visualization configuration
visualization.update.period=500

# Adapter configuration
vdaInterface.version=2.0.0
vdaInterface.map.id=map1
vdaInterface.mobileRobot.type.id=0
vdaInterface.mobileRobot.capability.lift=false
vdaInterface.factsheet=/opt/robot/config/factsheet-kmriisy.json