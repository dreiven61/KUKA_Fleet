syntax = "proto3";

package kuka.common.v1alpha1;

option csharp_namespace = "Kuka.Common.V1alpha1";
option java_package = "com.kuka.common.v1alpha1";
option java_outer_classname = "HostPortProto";
option java_multiple_files = true;

// The combination of ip address and the port number.
message HostPort
{
    // the ip address
    string host = 1;

    // the port
    int32 port = 2;
}