syntax = "proto3";

package kuka.mobilerobotics.applicationcontrol;

option csharp_namespace = "Kuka.MobileRobotics.ApplicationControlParameters";
option java_multiple_files = true;
option java_outer_classname = "ApplicationControlParametersProto";
option java_package = "com.kuka.mobilerobotics.applicationcontrol";

// Message representing data that can be exchanged through the application control
message ApplicationControlParameters
{
  // The integer parameter
  int32 int_parameter = 1;

  // The double precision floating point parameter
  double double_parameter = 2;

  // The boolean parameter
  bool bool_parameter = 3;

  // The string parameter
  string string_parameter = 4;
}
