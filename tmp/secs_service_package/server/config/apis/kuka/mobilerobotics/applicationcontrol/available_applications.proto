syntax = "proto3";

package kuka.mobilerobotics.applicationcontrol;

option csharp_namespace = "Kuka.MobileRobotics.AvailableApplications";
option java_multiple_files = true;
option java_outer_classname = "AvailableApplicationsProto";
option java_package = "com.kuka.mobilerobotics.applicationcontrol";

// Message containing the list of the currently available KRL applications
message AvailableApplications
{
  // The names of the available KRL applications
  repeated string application_names = 1;
}