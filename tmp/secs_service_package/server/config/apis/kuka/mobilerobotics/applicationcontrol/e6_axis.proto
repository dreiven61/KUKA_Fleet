syntax = "proto3";

package kuka.mobilerobotics.applicationcontrol;

import "google/protobuf/wrappers.proto";

option csharp_namespace = "Kuka.MobileRobotics.ApplicationControl";
option java_multiple_files = true;
option java_outer_classname = "E6AxisProto";
option java_package = "com.kuka.mobilerobotics.applicationcontrol";

// Current axis-specific setpoint position of the robot
// The variable of structure type E6AXIS contains the current axis angles or
// axis positions.
//
// In the robot program, the variable triggers an advance run stop.
// This proto is a copy of the module management service E6Axis.
message E6Axis
{
  // Setpoint position of the robot axis in [rad]
  double a1 = 1;

  // Setpoint position of the robot axis in [rad]
  double a2 = 2;

  // Setpoint position of the robot axis in [rad]
  double a3 = 3;

  // Setpoint position of the robot axis in [rad]
  double a4 = 4;

  // Setpoint position of the robot axis in [rad]
  double a5 = 5;

  // Setpoint position of the robot axis in [rad]
  double a6 = 6;

  // Setpoint position of the external axis 7 (if present)
  google.protobuf.DoubleValue e1 = 9;

  // Setpoint position of the external axis 8 (if present)
  google.protobuf.DoubleValue e2 = 10;

  // Setpoint position of the external axis 9 (if present)
  google.protobuf.DoubleValue e3 = 11;

  // Setpoint position of the external axis 10 (if present)
  google.protobuf.DoubleValue e4 = 12;

  // Setpoint position of the external axis 11 (if present)
  google.protobuf.DoubleValue e5 = 13;

  // Setpoint position of the external axis 12 (if present)
  google.protobuf.DoubleValue e6 = 14;
}