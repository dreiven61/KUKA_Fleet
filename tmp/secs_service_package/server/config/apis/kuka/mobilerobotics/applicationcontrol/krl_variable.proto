syntax = "proto3";

package kuka.mobilerobotics.applicationcontrol;

import "kuka/mobilerobotics/applicationcontrol/variable_value.proto";

option csharp_namespace = "Kuka.MobileRobotics.ApplicationControl";
option java_multiple_files = true;
option java_outer_classname = "KrlVariableProto";
option java_package = "com.kuka.mobilerobotics.applicationcontrol";

// Proto describing variable
message KrlVariable
{
  // The name of the variable to write
  string variable_name = 2;
  // The variable value to set
  VariableValue value = 3;
}
