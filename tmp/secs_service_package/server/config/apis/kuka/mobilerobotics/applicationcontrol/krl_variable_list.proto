syntax = "proto3";

package kuka.mobilerobotics.applicationcontrol;

import "kuka/mobilerobotics/applicationcontrol/krl_variable.proto";

option csharp_namespace = "Kuka.MobileRobotics.ApplicationControl";
option java_multiple_files = true;
option java_outer_classname = "KrlVariableListProto";
option java_package = "com.kuka.mobilerobotics.applicationcontrol";

// Proto describing KRL variables
message KrlVariableList
{
  // The list of KRL variables
  repeated KrlVariable variable_list = 1;
}
