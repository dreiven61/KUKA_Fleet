syntax = "proto3";

package kuka.mobilerobotics.applicationcontrol;

import "kuka/mobilerobotics/applicationcontrol/variable_value.proto";
import "kuka/mobilerobotics/applicationcontrol/execute_krl_application_action.proto";

option csharp_namespace = "Kuka.MobileRobotics.ApplicationControl";
option java_multiple_files = true;
option java_outer_classname = "ExecuteSkillActionProto";
option java_package = "com.kuka.mobilerobotics.applicationcontrol";

// Proto describing a command to start a skill
// 启动技能命令的 Proto 描述
message ExecuteSkillAction
{
  // The name of the application to execute.
  // 要执行的应用程序的名称。
  string skill_name = 1;

  // Input values for existing Skill variables
  // 现有 Skill 变量的输入值
  repeated SkillVariable input_parameters = 2;

  //Custom parameter list used to pass some business variables to Fleet, such as {"SN":"00001,00002","machineId":"01"}
  //自定义参数列表，便于扩展，用于传递一些业务变量到Fleet，如{"SN":"00001,00002","machineId":"01"}
  map<string, string> custom_parameters = 3;
}

// Proto describing variable
// 变量的 Proto 描述
message SkillVariable
{
  // 描述参数是给那个子动作用的, 在整个动作序列里面的唯一ID（由KS2生成）
  // Describes which sub-action the parameter is for, the unique ID in the entire action sequence (generated by KS2)
  string action_template_id = 1;
  // 描述参数是与那个动作模板的实现细节做匹配
  // Describes how the parameter matches the implementation details of the action template
  string action = 2;
  // 动作需要用到的参数细节描述
  // Details the parameter specifications required by the action
  repeated SkillArgument args = 3;
}

// Argument of skill has two options, external device argument or KRL application
// 技能的参数有两个选项，外部设备参数或 KRL 应用程序
message SkillArgument
{
  oneof argument_type {
    // KRL application as argument, the input value of KRL application is set as KrlVariable
    // 将 KRL 应用程序作为参数，KRL 应用程序的输入值设置为 KrlVariable
    ExecuteKrlApplicationAction krl_application_action = 1;
    // arguments that for external device
    // 针对外部设备的参数
    ExternalArgument external_argument = 2;
  }
}

// Argument for external device
// 外部设备的参数
message ExternalArgument
{
  // The name of the argument
  // 参数的名称
  string name = 1;
  // The argument value
  // 参数值
  VariableValue value = 2;
}
