syntax = "proto3";

package kuka.mobilerobotics.lift.v1alpha1;

import "google/protobuf/wrappers.proto";

option java_package = "com.kuka.mobilerobotics.lift.v1alpha1";
option java_outer_classname = "LiftDataProto";
option java_multiple_files = true;

message LiftData
{
   // current lift height (in meters)
   double height = 1;

   // Optional: current velocity along the lift height axis (in m/s)
   google.protobuf.DoubleValue velocity = 2;
}