syntax = "proto3";

package kuka.mobilerobotics.motion.v1alpha1;

option java_package = "com.kuka.mobilerobotics.motion.v1alpha1";
option java_outer_classname = "OrientationModeProto";
option java_multiple_files = true;

// Defines the drive direction of the AGV.
message OrientationMode
{
  enum Enum
	{
    // Unspecified
    UNSPECIFIED = 0;

    // The AGV may not rotate during driving
    FIXED = 1;

    // The AGV may rotate during driving
    VARIABLE = 2;
  }
}
