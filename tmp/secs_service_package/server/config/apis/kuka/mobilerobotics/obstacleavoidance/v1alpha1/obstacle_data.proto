syntax = "proto3";

package kuka.mobilerobotics.obstacleavoidance.v1alpha1;

import "google/protobuf/timestamp.proto";

import "kuka/mobilerobotics/obstacleavoidance/v1alpha1/obstacle.proto";
import "kuka/mobilerobotics/motioncontrol/dataprovider/v1/odometry.proto";

option java_package = "com.kuka.mobilerobotics.obstacleavoidance.v1alpha1";
option java_outer_classname = "ObstacleDataProto";
option java_multiple_files = true;

// Contains a list of obstacles.
message ObstacleData
{
  repeated Obstacle obstacles = 1;
  // The pose of the robot center in the odometry coordinate system when receiving this data.
  kuka.mobilerobotics.motioncontrol.dataprovider.v1.Odometry robot_pose = 2;
  // the timestamp when the obstacle data was recorded 
  google.protobuf.Timestamp timestamp = 3;
}
