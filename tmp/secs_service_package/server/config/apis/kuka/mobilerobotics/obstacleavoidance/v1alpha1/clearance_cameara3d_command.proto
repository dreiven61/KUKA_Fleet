syntax = "proto3";

package kuka.mobilerobotics.obstacleavoidance.v1alpha1;

option java_package = "com.kuka.mobilerobotics.obstacleavoidance.v1alpha1";
option java_outer_classname = "ClearanceCamera3dCommandProto";
option java_multiple_files = true;

// this command is used to set the clearance the 3d camera system observes
// the clearance is the distance from the floor where objects are recognized as obstacles
message ClearanceCamera3dCommand 
{
  // controls the overhead clearance of the camera (in meters)
  // objects above this height will be ignored for obstacle detection
  double clearance = 1;
  // if true, we limit the clearence to the height given in clearance_m, 
  // if false, no specific clearance is set
  bool enabled = 2;
}