syntax = "proto3";

package kuka.mobilerobotics.obstacleavoidance.v1alpha1;

import "kuka/mobilerobotics/obstacleavoidance/v1alpha1/velocity_limits_configuration.proto";

option java_package = "com.kuka.mobilerobotics.obstacleavoidance.v1alpha1";
option java_outer_classname = "VelocityLimitsConfigurationCommandProto";
option java_multiple_files = true;

// this command is used to set and override the velocity limits configuration for the 3d camera system
message VelocityLimitsConfigurationCommand
{
  VelocityLimitsConfiguration config = 1;
}