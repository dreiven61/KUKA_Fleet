syntax = "proto3";

package kuka.mobilerobotics.order.events.v1alpha1;

import "google/protobuf/wrappers.proto";

option java_package = "com.kuka.mobilerobotics.order.events.v1alpha1";
option java_outer_classname = "CommandIdSpecificationProto";
option java_multiple_files = true;

// Specifies a SECS command by ID and sub-ID.
message CommandIdSpecification
{
  // Refers to a SECS command by ID
  string command_id = 1;
	
  // Specifies a SECS sub command by ID
  // e.g. specifies a transfer command's TransferInfo ID/index
  // [optional] if the command does not support sub-commands
  google.protobuf.StringValue sub_command_id = 2;
}

