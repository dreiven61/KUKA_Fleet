syntax = "proto3";

package kuka.mobilerobotics.order.events.v1alpha1;

import "kuka/mobilerobotics/order/events/v1alpha1/aborting_event.proto";
import "kuka/mobilerobotics/order/events/v1alpha1/terminate_event.proto";
import "kuka/mobilerobotics/order/events/v1alpha1/transport_event.proto";

option java_package = "com.kuka.mobilerobotics.order.events.v1alpha1";
option java_outer_classname = "ExecutionEventProto";
option java_multiple_files = true;

// An ExecutionEvent notifies about the execution state of an order.
message ExecutionEvent {
  oneof type {
  
    // Command abortion has been initiated
    AbortingEvent aborting_event = 1;
	
    // Command has been terminated in an unusual way
    TerminateEvent terminate_event = 2;
	
    // Event message regarding transport command handling
    TransportEvent transport_event = 3;
  }
}

