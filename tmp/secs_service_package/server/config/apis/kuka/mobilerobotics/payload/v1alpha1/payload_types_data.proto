syntax = "proto3";

package kuka.mobilerobotics.payload.v1alpha1;

import "kuka/mobilerobotics/payload/v1alpha1/payload_type.proto";

option java_package = "com.kuka.mobilerobotics.payload.v1alpha1";
option java_outer_classname = "PayloadTypesDataProto";
option java_multiple_files = true;

// Contains a list of all known payload types in the system.
message PayloadTypesData {

  // The list of all payload types.
  repeated PayloadType payload_types = 1;

}