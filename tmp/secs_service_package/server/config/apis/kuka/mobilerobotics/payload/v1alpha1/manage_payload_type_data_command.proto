syntax = "proto3";

package kuka.mobilerobotics.payload.v1alpha1;

import "kuka/database/v1alpha1/manage_data_command_type.proto";
import "kuka/mobilerobotics/payload/v1alpha1/payload_type.proto";

option java_package = "com.kuka.mobilerobotics.payload.v1alpha1";
option java_outer_classname = "ManagePayloadTypeDataCommandProto";
option java_multiple_files = true;

// Manages a PayloadType data element in the PayloadType service. Provides a way to import, update and delete a PayloadType.
message ManagePayloadTypeDataCommand
{
  // Type field. Please see the enum "ManageDataCommandType" description.
  kuka.database.v1alpha1.ManageDataCommandType type = 1;
  // The new PayloadType's data.
  // Please refer to the "ManageDataCommandType" enum description for details about how the PayloadType data is used.
  PayloadType data = 2;
}
