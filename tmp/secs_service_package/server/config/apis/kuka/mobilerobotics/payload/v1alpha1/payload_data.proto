syntax = "proto3";

package kuka.mobilerobotics.payload.v1alpha1;

import "kuka/mobilerobotics/payload/v1alpha1/payload.proto";

option java_package = "com.kuka.mobilerobotics.payload.v1alpha1";
option java_outer_classname = "PayloadDataProto";
option java_multiple_files = true;

// Contains a list of all known payloads in the system.
message PayloadData {

  // The list of all payloads.
  repeated Payload payloads = 1;

}