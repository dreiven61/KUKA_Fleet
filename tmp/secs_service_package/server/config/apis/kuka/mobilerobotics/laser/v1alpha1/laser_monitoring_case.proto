syntax = "proto3";

package kuka.mobilerobotics.laser.v1alpha1;

option java_package = "com.kuka.mobilerobotics.laser.v1alpha1";
option java_outer_classname = "LaserMonitoringCaseProto";
option java_multiple_files = true;

// represents a single monitoring case
// at any time, only one case can be active, but it can contain multiple laser fields
message LaserMonitoringCase
{
    // ID of the laser this field is associated with
    int32 laser_id = 1;

    // number of this case, is referenced by SickMicroscan3DiagnosticData.active_monitoring_case
    int32 case_number = 2;

    // list of fields associated with this case
    repeated int32 field_indices = 3;
}