syntax = "proto3";

package kuka.mobilerobotics.localizer.v1alpha1;

import "kuka/database/v1alpha1/manage_data_command_type.proto";
import "kuka/mobilerobotics/localizer/v1alpha1/map.proto";

option java_package = "com.kuka.mobilerobotics.localizer.v1alpha1";
option java_outer_classname = "ManageMapDataCommandProto";
option java_multiple_files = true;

// Manages a map data element in the map service. Provides a way to import, update and delete a map.
message ManageMapDataCommand
{
  // Type field. Please see the enum "ManageDataCommandType" description.
  kuka.database.v1alpha1.ManageDataCommandType type = 1;
  // The new map's data.
  // Please refer to the "Type" enum description for details about how the map data is used.
  Map data = 2;
}
