syntax = "proto3";

package kuka.mobilerobotics.localizer.v1alpha1;

import "kuka/mobilerobotics/localizer/v1alpha1/map.proto";

option java_package = "com.kuka.mobilerobotics.localizer.v1alpha1";
option java_outer_classname = "MapDataProto";
option java_multiple_files = true;

// Contains a list of maps.
// When this data is received from a subscribe call on the data provider, the map objects only contain a UUID.
// When this data is received from a get call, the map objects contain the full data.
message MapData
{
  repeated Map maps = 1;
}
