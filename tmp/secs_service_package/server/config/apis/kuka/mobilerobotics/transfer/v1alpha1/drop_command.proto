syntax = "proto3";

package kuka.mobilerobotics.transfer.v1alpha1;

option java_package = "com.kuka.mobilerobotics.transfer.v1alpha1";
option java_outer_classname = "DropCommandProto";
option java_multiple_files = true;

// Describes a command that drops a payload from the robot onto a station.
message DropCommand {

  // The uuid of the payload to drop.
  // The payload is currently placed in the robot_compartment_uuid.
  string payload_uuid = 1;

  // The uuid of the station onto which to drop the payload.
  string station_uuid = 2;

  // The uuid of the station's compartment into which to drop the payload.
  string station_compartment_uuid = 3;

  // The uuid of the robot's compartment where the payload currently is.
  string robot_compartment_uuid = 4;

}
