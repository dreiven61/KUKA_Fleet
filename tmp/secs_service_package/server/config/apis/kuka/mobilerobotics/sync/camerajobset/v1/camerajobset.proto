syntax = "proto3";

package kuka.mobilerobotics.sync.camerajobset.v1;

option csharp_namespace = "Kuka.MobileRobotics.Sync.CameraJobset.V1";
option java_multiple_files = true;
option java_outer_classname = "CameraJobsetProto";
option java_package = "com.kuka.mobilerobotics.sync.camerajobset.v1";

// A message used to store a camera jobset.
message CameraJobset
{
  // The contents of the camera jobset file.
  bytes data = 1;
}
