syntax = "proto3";

package kuka.mobilerobotics.objects.v1alpha1;

import "kuka/mobilerobotics/objects/v1alpha1/object_model.proto";

option java_package = "com.kuka.mobilerobotics.objects.v1alpha1";
option java_outer_classname = "ObjectModelDataProto";
option java_multiple_files = true;

// Contains a list of object models. See "kuka.mobilerobotics.objects.v1alpha1.ObjectModel" for more information.
message ObjectModelData
{
    repeated ObjectModel objects = 1;
}
