syntax = "proto3";

package kuka.mobilerobotics.battery.v1;

option csharp_namespace = "Kuka.MobileRobotics.Battery.V1";
option java_multiple_files = true;
option java_outer_classname = "BatteryOperationTimeEstimationProto";
option java_package = "com.kuka.mobilerobotics.battery.v1";

// A message holds the remaining operation time of the robot (in seconds).
message BatteryOperationTimeEstimation
{
  // The remaining operation time of the robot (in seconds).
  int32 operation_time_estimation = 1;
}
