syntax = "proto3";

package kuka.mobilerobotics.battery.actionexecutor.v1;

import "google/protobuf/wrappers.proto";

option csharp_namespace = "Kuka.MobileRobotics.Battery.ActionExecutor.V1";
option java_multiple_files = true;
option java_outer_classname = "UpdateFirmwareCommandProto";
option java_package = "com.kuka.mobilerobotics.battery.actionexecutor.v1";

// Initiates firmware update on the battery.
message UpdateFirmwareCommand
{
  // The new firmware as a binary file.
  google.protobuf.BytesValue firmware_file = 1;
}
