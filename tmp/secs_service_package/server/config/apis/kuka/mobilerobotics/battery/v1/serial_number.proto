syntax = "proto3";

package kuka.mobilerobotics.battery.v1;

import "google/protobuf/wrappers.proto";

option csharp_namespace = "Kuka.MobileRobotics.Battery.V1";
option java_multiple_files = true;
option java_outer_classname = "SerialNumberProto";
option java_package = "com.kuka.mobilerobotics.battery.v1";

// The serial number of the battery pack
message SerialNumber
{
  // Serial number 
  google.protobuf.StringValue serial_number = 1;
}
