syntax = "proto3";

package kuka.mobilerobotics.objectdetection.v1alpha1;

import "kuka/mobilerobotics/objectdetection/v1alpha1/detected_object.proto";

option java_package = "com.kuka.mobilerobotics.objectdetection.v1alpha1";
option java_outer_classname = "ObjectDetectionResultProto";
option java_multiple_files = true;


// Contains information about the detected objects.
message ObjectDetectionResult {

  // The detected objects with poses and scores.
  repeated DetectedObject objects = 1;
}
