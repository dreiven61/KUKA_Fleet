syntax = "proto3";

package kuka.mobilerobotics.finelocalization.v1alpha1;

option java_package = "com.kuka.mobilerobotics.finelocalization.v1alpha1";
option java_outer_classname = "TeachLocationCommandResultProto";
option java_multiple_files = true;

// Result of the TeachLocationCommand
message TeachLocationCommandResult
{
  // The uuid of the location which was taught.
  string taught_location_uuid = 1;
}

