syntax = "proto3";

package kuka.mobilerobotics.graph.v1alpha1;

option java_package = "com.kuka.mobilerobotics.graph.v1alpha1";
option java_outer_classname = "ResourceGroupProto";
option java_multiple_files = true;

// A group of resources. The resource has specific capabilities, e.g. specific payload, battery state, lift. 
// A resource can be assigned to different groups depending on capabilities.  
message ResourceGroup 
{	
  // Defines a list of resources. 
  repeated string resource_id = 1;
}
