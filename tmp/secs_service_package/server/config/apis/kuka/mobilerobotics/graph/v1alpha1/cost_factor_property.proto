syntax = "proto3";

package apis.kuka.mobilerobotics.graph.v1alpha1;

option java_package = "com.kuka.mobilerobotics.graph.v1alpha1";
option java_outer_classname = "CostFactorPropertyProto";
option java_multiple_files = true;


// Definition of the cost factor value which can be set 
// for a node or an edge. Factor must be greater or equal to 1.
message CostFactorProperty
{
  // Defines the cost factor. Default value is 1. Less than 1 is not possible. 
  double factor = 1;
}