syntax = "proto3";

package kuka.mobilerobotics.graph.v1alpha1;

import "google/protobuf/wrappers.proto";
import "kuka/core/geometry/v1/velocity_2d.proto";

option java_package = "com.kuka.mobilerobotics.graph.v1alpha1";
option java_outer_classname = "MotionVelocityPropertyProto";
option java_multiple_files = true;


// Definition of the motion velocity which can be set for a node or edge.
// Note that if absolute and percentage values are set, then first the absolute value and 
// then the percent value of the absolute value is used 
//(e.g. absolute is 0.5 m/s and percentage is 0.5 then the resulting velocity is 0.25 m/s).
message MotionVelocityProperty
{
  // The maximum allowed absolute velocity [m/s] in the x-axis direction 
  // of the vehicle.
  // The maximum allowed absolute velocity [m/s] in the y-axis direction 
  // of the vehicle.
  // The maximum allowed absolute rotational velocity [rad/s].
  kuka.core.geometry.v1.Velocity2D max_velocity_absolute = 1;
	
  // Scale-down factor for the maximum allowed translational velocity. 
  // The allowed range for this value is (0,1]. It scales down the maximum 
  // vehicle x- and y- velocity and rotational velocity, after limiting it by the parameters 
  // max_x_velocity_meter_per_second, max_y_velocity_meter_per_second and 
  // max_rotational_velocity_rad_per_second.
  google.protobuf.DoubleValue max_velocity_percent = 2;

}
