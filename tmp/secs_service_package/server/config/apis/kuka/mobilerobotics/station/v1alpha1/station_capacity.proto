syntax = "proto3";

package kuka.mobilerobotics.station.v1alpha1;

import "kuka/mobilerobotics/station/v1alpha1/station_compartment.proto";

option java_package = "com.kuka.mobilerobotics.station.v1alpha1";
option java_outer_classname = "StationCapacityProto";
option java_multiple_files = true;

// Describes the capability of stations to store payloads.
message StationCapacity {

  // The compartments where payloads can be stored.
  repeated StationCompartment compartments = 1;

}
