syntax = "proto3";

package kuka.mobilerobotics.station.v1alpha1;

import "kuka/database/v1alpha1/manage_data_command_type.proto";
import "kuka/mobilerobotics/station/v1alpha1/station.proto";

option java_package = "com.kuka.mobilerobotics.station.v1alpha1";
option java_outer_classname = "ManageStationDataCommandProto";
option java_multiple_files = true;

// Manages a Station data element in the Station service. Provides a way to import, update and delete a Station.
message ManageStationDataCommand
{
  // Type field. Please see the enum "ManageDataCommandType" description.
  kuka.database.v1alpha1.ManageDataCommandType type = 1;
  // The new Station's data.
  // Please refer to the "ManageDataCommandType" enum description for details about how the Station data is used.
  Station data = 2;
}
