syntax = "proto3";

package kuka.mobilerobotics.ledstripe.actionexecutor.v1alpha1;

import "kuka/mobilerobotics/ledstripe/actionexecutor/v1alpha1/ledstrip_action_constants.proto";

option csharp_namespace = "Kuka.MobileRobotics.LedStripe.ActionExecutor.V1Alpha1";
option java_multiple_files = true;
option java_outer_classname = "SetRotatingEffectActionProto";
option java_package = "com.kuka.mobilerobotics.ledstripe.actionexecutor.v1alpha1";

// Provides method for applying custom visualization on the LED strip.
// It can override the default behavior of the LED strip but it is
// independent from SetBackgroundColorAction action.
// This action applies rotating effect to the LED strip and
// can be revoked with the ResetEffectAction method.
message SetRotatingEffectCommand
{
  // The color to be set on segment.
  SegmentColor.Enum color = 1;

  // Time period to elapse before switching state. [millisecond]
  uint32 period = 2;

  // The rotating effect direction clockwise or counter clockwise.
  // protolint:disable:next FIELD_NAMES_LOWER_SNAKE_CASE
  bool isClockwise = 3;
}
