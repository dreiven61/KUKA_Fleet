syntax = "proto3";

package kuka.mobilerobotics.ledstripe.actionexecutor.v1alpha1;

import "kuka/mobilerobotics/ledstripe/actionexecutor/v1alpha1/ledstrip_action_constants.proto";

option csharp_namespace = "Kuka.MobileRobotics.LedStripe.ActionExecutor.V1Alpha1";
option java_multiple_files = true;
option java_outer_classname = "SetBackgroundColorActionProto";
option java_package = "com.kuka.mobilerobotics.ledstripe.actionexecutor.v1alpha1";

// Provides method for applying custom visualization on the LED strip.
// It can override the default behavior of the LED strip but it is
// independent from other effect actions.
// This action applies background color to the LED strip and
// can be revoked with the ResetBackgroundColorAction method.
message SetBackgroundColorCommand
{
  // The color to be set as background.
  SegmentColor.Enum color = 1;
}
