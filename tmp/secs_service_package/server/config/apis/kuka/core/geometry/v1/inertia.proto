syntax = "proto3";

package kuka.core.geometry.v1;

option csharp_namespace = "Kuka.Core.Geometry.V1";
option java_package = "com.kuka.core.geometry.v1";
option java_outer_classname = "InertiaProto";
option java_multiple_files = true;


// Represents the inertia of some physical object, i.e.
// the resistance to any change in its velocity.
message Inertia
{
  double jx = 1;
  double jy = 2;
  double jz = 3;
}
