syntax = "proto3";

package kuka.core.geometry.v1;

import "kuka/core/geometry/v1/shape_2d.proto";

option csharp_namespace = "Kuka.Core.Geometry.V1";
option java_package = "com.kuka.core.geometry.v1";
option java_outer_classname = "RepeatedShape2DProto";
option java_multiple_files = true;

// Represents list of 2D Shapes
message RepeatedShape2D {
  repeated kuka.core.geometry.v1.Shape2D shapes = 1;
}