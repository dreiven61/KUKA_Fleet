syntax = "proto3";

package kuka.core.geometry.v1;

option csharp_namespace = "Kuka.Core.Geometry.V1";
option java_package = "com.kuka.core.geometry.v1";
option java_outer_classname = "QuaternionProto";
option java_multiple_files = true;


// Represents an orientation in 3D space in quaternion form.
message Quaternion
{
  double qx = 1;
  double qy = 2;
  double qz = 3;
  double qw = 4;
}