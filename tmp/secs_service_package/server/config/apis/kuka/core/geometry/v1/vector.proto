syntax = "proto3";

package kuka.core.geometry.v1;

option csharp_namespace = "Kuka.Core.Geometry.V1";
option java_package = "com.kuka.core.geometry.v1";
option java_outer_classname = "VectorProto";
option java_multiple_files = true;


// Represents a vector in 3D space.
message Vector
{
  double x = 1;
  double y = 2;
  double z = 3;
}