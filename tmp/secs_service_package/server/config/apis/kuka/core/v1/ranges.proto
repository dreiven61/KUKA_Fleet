syntax = "proto3";

package kuka.core.v1;

option csharp_namespace = "Kuka.Core.V1";
option java_package = "com.kuka.core.v1";
option java_outer_classname = "RangesProto";
option java_multiple_files = true;


// Defines a range of double values.
// Per default the min (lower bound) and max
// (upper bound) values are included.
// If the lower bound is greater the the upper
// bound the range is considered empty.
message DoubleRange
{
  // The lower bound of the range.
  double min = 1;

  // Specifies whether the lower bound should be
  // included or not. If not set it is included.
  bool min_exclusive = 2;

  // The upper bound of the range.
  double max = 3;

  // Specifies whether the upper bound should be
  // included or not. If not set it is included.
  bool max_exclusive = 4;
}
