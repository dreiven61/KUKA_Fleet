syntax = "proto3";

package kuka.core.v1;

option csharp_namespace = "Kuka.Core.V1";
option java_package = "com.kuka.core.v1";
option java_outer_classname = "ActiveStateProto";
option java_multiple_files = true;


// Represents the active state of an entitiy.
enum ActiveState
{
  // No value has been specified.
  // If the entity allowed partial updates
  // (i.e. patch updates) the previous
  // value will not be overridden.
  UNSPECIFIED_ACTIVE_STATE = 0;
    
  // The received value is not known in this version.
  // This is a response-only value.
  UNKNOWN_ACTIVE_STATE = 1;

  // The entity is still active.
  ACTIVE = 2;
    
  // The entity has been deleted.
  DELETED = 3;
}