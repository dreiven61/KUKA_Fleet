syntax = "proto3";

package kuka.database.v1alpha1;

option csharp_namespace = "Kuka.Database.V1alpha1";
option java_package = "com.kuka.database.v1alpha1";
option java_outer_classname = "UuidFilterProto";
option java_multiple_files = true;

// Used to filter data from a database service based on the data's UUID.
// Database services deliver fleet-available data such as maps, stations, locations or graphs.
message UuidFilter
{
  // The uuid to filter with.
  string uuid = 1;
}